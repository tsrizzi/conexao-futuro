[project]
name = "conexao-futuro"
version = "0.1.0"
description = "Agente conversacional que ajuda estudantes do Ensino Médio a descobrir cursos técnicos do CNCT."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=2.3,<3",
    "httpx2>=2.0",
    "numpy>=2.5.4",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0.3",
    "sentencepiece>=0.2.2",
    "onnxruntime>=1.31.0",
    "huggingface-hub>=0.20,<2",  # <2 por compatibilidade com o fastembed (teste de equivalência)
    "snowballstemmer>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # exigido pelo TestClient do FastAPI
    "ruff>=0.6",
    "mypy>=1.10",
    "fastembed>=0.9.0",
]
ingest = [
    "pdfplumber>=0.11.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["modelo: usa o modelo de embeddings real (mais lento)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
