# Itens do teste de interesses do SouTec (MEC), transcritos dos prints do app (out/2026).
# Escala original: 1 (interesse mínimo) a 5 (interesse máximo).
# Os itens seguem um ciclo fixo de 6 dimensões: A, C, E, I, R, S (12 itens por dimensão).
# A classificação por dimensão foi INFERIDA a partir desse padrão cíclico. Nomes confirmados nos
# prints do resultado: "Técnico-Operacional" (R) e "Empreendedor" (E). Os demais nomes são nossos.
# O item 37 não estava nos prints; pelo ciclo, é da dimensão A (Artístico).
#
# USO NO SISTEMA: referência para (1) o formulário curto, (2) os exemplos que o agente usa
# para sondar cada dimensão na conversa e (3) os testes de avaliação. NÃO reproduzir o teste inteiro.

