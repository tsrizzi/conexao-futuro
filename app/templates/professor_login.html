{% extends "professor_base.html" %}

{% block conteudo %}
<section class="painel painel-login">
  <h1 class="titulo-pagina">Painel do professor</h1>
  <p>Aqui você cria o código da turma e vê, depois da atividade, quantos participaram e quais áreas apareceram mais. Nada identifica os estudantes.</p>

  <form class="form-painel" method="post" action="/professor/entrar">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="form-label" for="senha">Senha do painel</label>
    <input class="form-control" id="senha" name="senha" type="password" required
           autocomplete="current-password" {% if sem_senha %}disabled{% endif %}>
    {% if erro %}<p class="erro-formulario" role="alert">{{ erro }}</p>{% endif %}
    <button class="btn btn-primary btn-lg" type="submit" {% if sem_senha %}disabled{% endif %}>Entrar</button>
  </form>
</section>
{% endblock %}
