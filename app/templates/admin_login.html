{% extends "admin_base.html" %}

{% block conteudo %}
<section class="painel painel-login">
  <h1 class="titulo-pagina">Área do admin</h1>
  <p>Aqui você gera os códigos de entrada no site, com data de início e de término.</p>

  <form class="form-painel" method="post" action="/admin/entrar">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="form-label" for="usuario">Usuário</label>
    <input class="form-control" id="usuario" name="usuario" required autocomplete="username"
           autocapitalize="none" spellcheck="false" {% if fechado %}disabled{% endif %}>
    <label class="form-label" for="senha">Senha</label>
    <input class="form-control" id="senha" name="senha" type="password" required
           autocomplete="current-password" {% if fechado %}disabled{% endif %}>
    {% if erro %}<p class="erro-formulario" role="alert">{{ erro }}</p>{% endif %}
    <button class="btn btn-primary btn-lg" type="submit" {% if fechado %}disabled{% endif %}>Entrar</button>
  </form>
</section>
{% endblock %}
